<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GME App Guide - Admin Login</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --border: #e1e4e8;
    --text: #1a1d21;
    --text-muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --error: #dc2626;
    --error-bg: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --card-bg: #202127;
      --border: #33343b;
      --text: #e8e9ec;
      --text-muted: #9aa0aa;
      --error-bg: #2c1414;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 26px;
    width: 100%;
    max-width: 320px;
  }
  h1 { font-size: 17px; margin: 0 0 18px; }
  input {
    width: 100%;
    font-size: 20px;
    letter-spacing: 4px;
    text-align: center;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    display: none;
    background: var(--error-bg);
    color: var(--error);
    font-size: 12.5px;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  .error.on { display: block; }
</style>
</head>
<body>
<div class="box">
  <h1>GME App Guide - Admin</h1>
  <div class="error" id="err"></div>
  <form id="form" autocomplete="off">
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" id="pin" placeholder="Admin PIN" autofocus>
    <button type="submit" id="submitBtn">Unlock</button>
  </form>
</div>
<script>
const form = document.getElementById("form");
const pinInput = document.getElementById("pin");
const errBox = document.getElementById("err");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errBox.classList.remove("on");
  submitBtn.disabled = true;
  try {
    const resp = await fetch("/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: pinInput.value.trim() }),
    });
    const data = await resp.json();
    if (resp.ok && data.ok) {
      window.location.href = "/admin";
      return;
    }
    errBox.textContent = data.error || "Login failed";
    errBox.classList.add("on");
  } catch (e) {
    errBox.textContent = "Request failed: " + e;
    errBox.classList.add("on");
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
